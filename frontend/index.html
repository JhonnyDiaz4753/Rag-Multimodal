<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consulta de manuales técnicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/Style.css">
  <!-- Versiones fijas. Para uso sin internet, descárgalas a /vendor y cambia las rutas. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
  <script type="module" src="js/App.js"></script>
</head>
<body>
  <div class="app">

    <!-- Panel izquierdo: documentos -->
    <aside class="rail" aria-label="Documentos">
      <h1 class="brand">Manuales</h1>

      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Subir un PDF">
        <p class="dropzone-title">Subir un PDF</p>
        <p class="dropzone-hint">Arrastra el archivo aquí o pulsa para elegirlo. Máximo 50 MB.</p>
        <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
      </div>

      <section aria-labelledby="jobs-title">
        <h2 id="jobs-title" class="rail-title">Procesamiento</h2>
        <ul class="jobs" id="jobs" aria-live="polite"></ul>
        <p class="empty" id="jobs-empty">Aún no has subido documentos.</p>
      </section>

      <details class="conn" id="conn">
        <summary>Conexión</summary>
        <label class="check">
          <input type="checkbox" id="mock-toggle">
          <span>Modo demo (sin servidor)</span>
        </label>
        <label class="field">
          <span>URL de la API</span>
          <input type="url" id="api-base" placeholder="http://localhost:8000" spellcheck="false">
        </label>
      </details>
    </aside>

    <!-- Panel principal: chat -->
    <main class="chat">
      <header class="chat-head">
        <label class="scope">
          <span>Buscar en</span>
          <select id="doc-select" aria-label="Documento donde buscar">
            <option value="">Todos los documentos</option>
          </select>
        </label>
        <span class="badge" id="mock-badge" hidden>Modo demo</span>
        <button class="btn-ghost" id="new-chat" type="button">Nueva conversación</button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Conversación"></div>

      <form class="composer" id="composer" autocomplete="off">
        <label for="question" class="sr-only">Tu pregunta</label>
        <textarea id="question" rows="1" placeholder="Pregunta algo sobre tus manuales…" maxlength="2000"></textarea>
        <button class="btn-primary" id="send" type="submit">Preguntar</button>
      </form>
    </main>
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Imagen ampliada">
    <form method="dialog"><button class="lightbox-close" aria-label="Cerrar">Cerrar</button></form>
    <img id="lightbox-img" alt="">
    <p id="lightbox-caption"></p>
  </dialog>
</body>
</html>
